name: Pulumi Deploy on Tag

# Pushing a version tag (e.g. v1.2.3) re-runs `pulumi up` against the prod
# stack so the droplet picks up any infrastructure or config changes.
on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

jobs:
  pulumi-up:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pulumi
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          uv venv
          uv pip install -r requirements.txt

      - name: Install Pulumi CLI
        uses: pulumi/actions@v6

      - name: Pulumi up
        uses: pulumi/actions@v6
        with:
          command: up
          stack-name: prod
          work-dir: pulumi
          cloud-url: ${{ secrets.PULUMI_BACKEND_URL }}
        env:
          # Stack secrets were encrypted locally with an empty passphrase;
          # /dev/null supplies zero bytes, matching that empty passphrase.
          PULUMI_CONFIG_PASSPHRASE_FILE: /dev/null
          DIGITALOCEAN_TOKEN: ${{ secrets.DIGITALOCEAN_TOKEN }}
          AWS_ACCESS_KEY_ID: ${{ secrets.SPACES_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.SPACES_ACCESS_SECRET_KEY }}
